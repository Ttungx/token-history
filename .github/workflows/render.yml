name: Render charts

# Manual escape hatch only. `run.sh collect` renders charts locally and commits
# them alongside the data, which keeps master to a single writer: while this
# workflow also pushed charts, no local push could ever fast-forward and every
# run had to `pull --rebase` first. Dispatch it after editing render.py or a
# style from the web UI — otherwise the next 20:00 collect re-renders anyway.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Two machines can push within seconds of each other; only the last render matters.
  group: render-charts
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Render
        run: uv run scripts/render.py

      - name: Commit charts
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # SUMMARY.md too: render.py rewrites it on every run, and staging only
          # charts/ silently threw that rewrite away — the table sat on its
          # initial-commit numbers through 8 regenerates, under-reporting Codex
          # by 390M tokens, while the charts beside it stayed correct.
          git add charts SUMMARY.md
          if git diff --cached --quiet; then
            echo "charts unchanged"
            exit 0
          fi
          git commit -m "charts: regenerate"
          # No infinite loop: pushes made with the default GITHUB_TOKEN do not
          # trigger workflows. Documented GitHub behaviour, not a trick.
          git push
